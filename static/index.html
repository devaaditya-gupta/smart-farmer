<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Farmer · Risk Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);--txt:#f4f1ea;--mut:#928e86;--amb:#f0b429;--emb:#ff7a2f;--grn:#8fd18b;--red:#f26b5b}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--txt);font:15px Inter,system-ui,sans-serif;min-height:100vh;display:flex;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(120px);z-index:-1;animation:drift 18s ease-in-out infinite alternate}
body:before{width:520px;height:520px;background:rgba(255,122,47,.20);top:-160px;right:-120px}
body:after{width:440px;height:440px;background:rgba(240,180,41,.13);bottom:-160px;left:200px;animation-delay:-9s}
@keyframes drift{to{transform:translate(-80px,60px) scale(1.15)}}
aside{width:236px;padding:28px 18px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;background:rgba(10,10,11,.6);backdrop-filter:blur(14px)}
.logo{font:700 21px Lora,serif;margin:0 8px 26px;line-height:1.2}.logo span{color:var(--amb)}.logo small{display:block;font:500 10px Inter;letter-spacing:.2em;color:var(--mut);margin-top:6px}
nav button{all:unset;cursor:pointer;display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:12px;color:var(--mut);transition:.25s;width:100%;box-sizing:border-box}
nav button:hover{color:var(--txt);background:var(--card)}nav button.on{color:#0a0a0b;background:var(--amb);font-weight:600;box-shadow:0 0 26px rgba(240,180,41,.35)}
.foot{margin-top:auto;font-size:12px;color:var(--mut);padding:0 8px}
main{flex:1;padding:34px 44px;max-width:1180px}
h1{font:700 34px Lora,serif;margin-bottom:4px}.sub{color:var(--mut);margin-bottom:26px}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;backdrop-filter:blur(10px);animation:rise .6s both;transition:.3s}
.card.hv:hover{transform:translateY(-4px);border-color:rgba(240,180,41,.45);box-shadow:0 0 34px rgba(240,180,41,.14)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.stat b{display:block;font:700 38px Lora,serif;margin-top:6px}.stat i{font:500 11px Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-style:normal}
.stat.a b{color:var(--amb)}.stat.r b{color:var(--red)}.stat.g b{color:var(--grn)}
h3{font:600 18px Lora,serif;margin-bottom:14px}
table{width:100%;border-collapse:collapse}th{text-align:left;font:500 11px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);padding:8px 10px}
td{padding:12px 10px;border-top:1px solid var(--line)}tr.cl{cursor:pointer}tr.cl:hover td{background:rgba(255,255,255,.03)}
.chip{padding:3px 11px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid}
.Low,.Repaid{color:var(--grn);border-color:rgba(143,209,139,.4);background:rgba(143,209,139,.1)}.Medium,.Active,.Growing{color:var(--amb);border-color:rgba(240,180,41,.4);background:rgba(240,180,41,.1)}.High,.Overdue,.Poor{color:var(--red);border-color:rgba(242,107,91,.4);background:rgba(242,107,91,.1)}.Good{color:var(--grn);border-color:rgba(143,209,139,.4);background:rgba(143,209,139,.1)}
.bar{height:7px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;min-width:90px}.bar i{display:block;height:100%;border-radius:9px;transition:width 1s}
form,.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}label{display:flex;flex-direction:column;gap:5px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);flex:1;min-width:130px}
input,select{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:11px;padding:11px 12px;color:var(--txt);font:15px Inter;outline:none;transition:.2s}
input:focus,select:focus{border-color:var(--amb);box-shadow:0 0 0 3px rgba(240,180,41,.15)}select option{background:#17171a}
.btn{cursor:pointer;border:0;border-radius:11px;padding:11px 20px;font:600 14px Inter;color:#0a0a0b;background:linear-gradient(135deg,var(--amb),var(--emb));transition:.25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(255,122,47,.4)}.btn.sm{padding:6px 13px;font-size:12px}.btn.gh{background:none;color:var(--amb);border:1px solid rgba(240,180,41,.5)}
.gauge{position:relative;width:200px;height:200px;margin:auto}.gauge svg{transform:rotate(-90deg)}.gauge circle{fill:none;stroke-width:13;stroke-linecap:round}
.gauge .t{stroke:rgba(255,255,255,.08)}.gauge .v{transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 9px currentColor)}
.gauge div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.gauge b{font:700 54px Lora,serif}.gauge span{font:600 11px Inter;letter-spacing:.2em}
.two{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:center}.back{margin-bottom:16px}
#toast{position:fixed;bottom:26px;right:26px;padding:14px 22px;border-radius:14px;background:#17171a;border:1px solid var(--amb);box-shadow:0 0 30px rgba(240,180,41,.25);transform:translateY(90px);opacity:0;transition:.4s;z-index:9}
#toast.on{transform:none;opacity:1}#toast.bad{border-color:var(--red);box-shadow:0 0 30px rgba(242,107,91,.3)}
.empty{color:var(--mut);text-align:center;padding:30px}
@media(max-width:820px){aside{display:none}main{padding:22px}.two{grid-template-columns:1fr}}
body.locked aside,body.locked main{display:none}#login{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:var(--bg)}body.locked #login{display:grid}.lc{width:min(400px,92vw)}.lc .logo{margin:0 0 6px}.lc form{flex-direction:column;align-items:stretch}
.lg{display:flex;gap:6px;margin:8px 0 14px}.lg button{all:unset;cursor:pointer;padding:5px 12px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--mut)}.lg button.on{background:var(--amb);color:#0a0a0b;font-weight:600}
.tools{display:flex;flex-direction:column;gap:8px;margin-top:auto;padding:0 6px}.foot{margin-top:14px}.on.btn{animation:pulse 1s infinite}@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(240,180,41,.28)}}#toast{z-index:30}
#login .reg{display:none}#login.regmode .reg{display:block}#login.regmode .sig{display:none}.lg{flex-wrap:wrap}#login a{color:var(--amb);text-decoration:none;cursor:pointer}
#bell{position:fixed;top:18px;right:26px;z-index:15;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(20,20,22,.8);backdrop-filter:blur(10px);color:var(--txt);font-size:18px;cursor:pointer;transition:.25s}
#bell:hover{border-color:var(--amb);box-shadow:0 0 22px rgba(240,180,41,.3)}#bell.ring{animation:ring .8s}@keyframes ring{20%{transform:rotate(18deg)}40%{transform:rotate(-16deg)}60%{transform:rotate(10deg)}80%{transform:rotate(-6deg)}}
#bn{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:99px;background:var(--red);color:#fff;font:600 11px Inter;display:none;place-items:center;padding:0 5px}
#np{position:fixed;top:70px;right:26px;width:350px;max-height:440px;z-index:15;background:rgba(18,18,20,.97);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 30px rgba(240,180,41,.08);display:none;overflow:hidden;flex-direction:column}
#np.on{display:flex}.nh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}.nh a{font-size:12px;color:var(--amb);cursor:pointer}#nl{overflow:auto}
.ni{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);font-size:14px;animation:rise .4s both}.ni.un{background:rgba(240,180,41,.07)}.ni i{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none;box-shadow:0 0 10px currentColor}.ni small{display:block;color:var(--mut);font-size:11px;margin-top:3px}
body.locked #bell,body.locked #np{display:none!important}@media(max-width:820px){#np{width:calc(100vw - 32px);right:16px}}
.Pending{color:var(--amb);border-color:rgba(240,180,41,.4);background:rgba(240,180,41,.1)}.Paid{color:var(--grn);border-color:rgba(143,209,139,.4);background:rgba(143,209,139,.1)}
#md{position:fixed;inset:0;z-index:25;display:none;place-items:center;background:rgba(0,0,0,.66);backdrop-filter:blur(6px)}#md.on{display:grid}#mc{width:min(580px,94vw);max-height:90vh;overflow:auto;background:rgba(20,20,22,.97)}
</style></head><body class="locked">
<aside><div class="logo">Smart <span>Farmer</span><small>RISK TRACKER</small></div>
<nav id="nav"></nav><div class="tools"><div class="lg"><button data-l="en">EN</button><button data-l="hi">हिं</button><button data-l="ta">தமிழ்</button><button data-l="te">తెలుగు</button></div>
<button class="btn gh sm" onclick="voiceCmd(this)"><span>🎤</span> Voice command</button><button class="btn gh sm" onclick="speak()"><span>🔊</span> Read aloud</button><button class="btn gh sm" onclick="logout()">Logout</button></div><div class="foot">Officer console<br>Cooperative lending</div></aside>
<main id="app"></main><div id="toast"></div>
<div id="md" onclick="if(event.target.id=='md')closeM()"><div class="card" id="mc"></div></div>
<button id="bell" onclick="togN()"><span>🔔</span><b id="bn">0</b></button>
<div id="np"><div class="nh"><b>Notifications</b><a onclick="readAll()">Mark all read</a></div><div id="nl"></div></div>
<div id="login"><div class="card lc"><div class="logo">Smart <span>Farmer</span><small>RISK TRACKER</small></div><p class="sub">Evidence-based lending for farmers</p>
<div class="lg"><button data-l="en">EN</button><button data-l="hi">हिं</button><button data-l="ta">தமிழ்</button><button data-l="te">తెలుగు</button></div><div class="sig"><h3>Officer sign in</h3>
<form onsubmit="event.preventDefault();signin()"><label>Username<div class="row" style="flex-wrap:nowrap"><input id="lu" autocomplete="username" required style="flex:1;min-width:0"><button type="button" class="btn gh sm" onclick="listen(t=>$('#lu').value=t.replace(/[\s.]/g,''),this)">🎤</button></div></label>
<label>Password<input id="lp" type="password" autocomplete="current-password" required></label><button class="btn" style="width:100%">Sign in</button></form>
<p class="sub" style="margin:14px 0 0;font-size:12px">Tap 🎤 and say your username</p>
<p class="sub" style="margin:10px 0 0;font-size:13px"><a onclick="regMode(true)">New officer? Create an account</a></p></div>
<div class="reg"><h3>Create officer account</h3><form onsubmit="event.preventDefault();register()">
<label>Full name<input id="rn" required autocomplete="name"></label><label>Username<input id="ru" required autocomplete="username" pattern="[A-Za-z0-9_]{3,20}"></label>
<label>Password<input id="rp" type="password" required minlength="6" autocomplete="new-password"></label><label>Confirm password<input id="rp2" type="password" required minlength="6" autocomplete="new-password"></label>
<button class="btn" style="width:100%">Create account</button></form>
<p class="sub" style="margin:14px 0 0;font-size:13px"><a onclick="regMode(false)">Already registered? Sign in</a></p></div></div></div>
<script>
const $=s=>document.querySelector(s),M=n=>'₹'+Number(n).toLocaleString('en-IN'),today=new Date().toISOString().slice(0,10);
const api=async(u,b)=>{const r=await fetch('/api/'+u,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});const j=await r.json();if(r.status==401&&u!="login")showLogin();if(!r.ok)throw new Error(tr(j.error||j.message));return j};
const toast=(m,bad)=>{const t=$('#toast');t.textContent=m;t.className='on'+(bad?' bad':'');clearTimeout(t.h);t.h=setTimeout(()=>t.className='',3200)};
const col=s=>s>=70?'#8fd18b':s>=45?'#f0b429':'#f26b5b';
const chip=s=>`<span class="chip ${s}">${s}</span>`,meter=s=>`<div class="bar"><i style="width:${s}%;background:${col(s)}"></i></div>`;
const opts=(a,v,l)=>a.map(x=>`<option value="${x[v]}">${typeof l=='function'?l(x):x[l]}</option>`).join('');
const act=async(fn,ok)=>{try{await fn();toast(ok);}catch(e){toast(e.message,1)}};
let BUSY=false;const once=fn=>async(...a)=>{if(BUSY)return;BUSY=true;try{await fn(...a)}finally{BUSY=false}};
const NAV=[['dash','◆','Dashboard'],['farmers','☘','Farmers'],['cycles','❀','Crop cycles'],['loans','₹','Loans & repayments'],['elig','✓','Eligible farmers']];
$('#nav').innerHTML=NAV.map(n=>`<button id="n-${n[0]}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('');
function go(v,a){CUR={v,a};document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.id=='n-'+(v=='prof'?'farmers':v)));
 Promise.resolve().then(()=>V[v](a)).catch(e=>{if(CUR.v!=v)return;$('#app').innerHTML=`<div class="card empty"><h3>Could not load this page</h3><p class="sub" style="margin:0 0 16px">${e.message||e}</p><button class="btn" onclick="go('${v}',${a===undefined?'undefined':JSON.stringify(a)})">Try again</button></div>`;toast(e.message||String(e),1)})}
function countUp(){document.querySelectorAll('[data-n]').forEach(e=>{const n=+e.dataset.n,m=e.dataset.m;let t=0;const s=()=>{t+=Math.max(1,n/40);if(t>=n)t=n;e.textContent=m?M(Math.round(t)):Math.round(t);if(t<n)requestAnimationFrame(s)};s()})}
const head=(t,s)=>`<h1>${t}</h1><p class="sub">${s}</p>`;
function gauge(sc,st){const c=2*Math.PI*86;return `<div class="gauge"><svg width="200" height="200"><circle class="t" cx="100" cy="100" r="86"/><circle class="v" id="gv" cx="100" cy="100" r="86" stroke="${col(sc)}" style="color:${col(sc)}" stroke-dasharray="${c}" stroke-dashoffset="${c}"/></svg><div><b>${sc}</b><span style="color:${col(sc)}">${st.toUpperCase()} RISK</span></div></div>`}
const fillGauge=sc=>setTimeout(()=>{const g=$('#gv');if(g){const c=2*Math.PI*86;g.style.strokeDashoffset=c*(1-sc/100)}},80);
const V={
async dash(){const d=await api('dashboard'),f=await api('farmers'),t=d.farmers||1;
 $('#app').innerHTML=head('Good day, Officer','Live view of farmer risk and the lending fund')+`<div class="grid g4">
 ${[['Farmers',d.farmers,'',''],['Active loans',d.active,'a',''],['Overdue loans',d.overdue,'r',''],['Fund balance',d.fund,'g','1']].map((s,i)=>`<div class="card stat ${s[2]} hv" style="animation-delay:${i*.08}s"><i>${s[0]}</i><b data-n="${s[1]}" data-m="${s[3]}">0</b></div>`).join('')}</div>
 <div class="grid" style="grid-template-columns:1fr 1.4fr;margin-top:16px">
 <div class="card"><h3>Risk distribution</h3>${[['Low',d.low,'#8fd18b'],['Medium',d.medium,'#f0b429'],['High',d.high,'#f26b5b']].map(r=>`<div style="margin-bottom:16px"><div class="row" style="justify-content:space-between;margin-bottom:6px"><span>${r[0]}</span><b>${r[1]}</b></div><div class="bar"><i style="width:${r[1]/t*100}%;background:${r[2]};box-shadow:0 0 12px ${r[2]}"></i></div></div>`).join('')}</div>
 <div class="card"><h3>Watchlist · highest risk</h3><table>${[...f].sort((a,b)=>a.risk_score-b.risk_score).slice(0,4).map(x=>`<tr class="cl" onclick="go('prof',${x.farmer_id})"><td>${x.name}<br><small style="color:var(--mut)">${x.village}</small></td><td>${meter(x.risk_score)}</td><td>${chip(x.risk_status)}</td></tr>`).join('')}</table></div></div>`;countUp()},
async farmers(){const f=await api('farmers');
 $('#app').innerHTML=head('Farmers','Register farmers and open their risk profile')+`<div class="card"><h3>Register a farmer</h3><form onsubmit="event.preventDefault();addF()"><label>Name<input id="fn" required></label><label>Phone<input id="fp" required pattern="[0-9]{10}" placeholder="10 digits"></label><label>Village<input id="fv" required></label><button class="btn">Add farmer</button></form></div>
 <div class="card" style="margin-top:16px"><table><tr><th>Farmer</th><th>Village</th><th>Phone</th><th>Score</th><th>Status</th></tr>${f.map(x=>`<tr class="cl" onclick="go('prof',${x.farmer_id})"><td><b>${x.name}</b></td><td>${x.village}</td><td>${x.phone}</td><td>${meter(x.risk_score)}</td><td>${chip(x.risk_status)} <small style="color:var(--mut)">${x.risk_score}</small></td></tr>`).join('')}</table></div>`},
async prof(id){const p=await api('farmers/'+id),f=p.farmer,pts=p.log.map((l,i,a)=>`${i*(240/Math.max(a.length-1,1))},${60-l.score*.55}`).join(' ');
 $('#app').innerHTML=`<button class="btn gh sm back" onclick="go('farmers')">← All farmers</button>`+head(f.name,`${f.village} · ${f.phone}`)+`<div class="card two">${gauge(f.risk_score,f.risk_status)}<div><h3>Score history</h3><svg viewBox="0 0 240 64" style="width:100%;height:90px"><polyline fill="none" stroke="${col(f.risk_score)}" stroke-width="2.5" points="${pts}" style="filter:drop-shadow(0 0 5px ${col(f.risk_score)})"/></svg><p class="sub" style="margin:8px 0 0">${p.log.length} recalculations by sp_calc_risk</p></div></div>
 <div class="card" style="margin-top:16px"><h3>Crop history</h3>${p.cycles.length?`<table><tr><th>Crop</th><th>Area</th><th>Sown</th><th>Yield</th><th>Status</th></tr>${p.cycles.map(c=>`<tr><td>${c.crop_name}</td><td>${c.area} ac</td><td>${c.sowing_date}</td><td>${c.yield_qty??'—'}</td><td><span class="chip ${c.status}">${c.status}</span></td></tr>`).join('')}</table>`:'<div class="empty">No crop cycles yet</div>'}</div>
 <div class="card" style="margin-top:16px"><h3>Loan history</h3>${p.loans.length?`<table><tr><th>Loan</th><th>Amount</th><th>Paid</th><th>Due</th><th>Status</th></tr>${p.loans.map(l=>`<tr><td>#${l.loan_id}</td><td>${M(l.amount)}</td><td>${M(l.paid)}</td><td>${l.due_date}</td><td><span class="chip ${l.status}">${l.status}</span></td></tr>`).join('')}</table>`:'<div class="empty">No loans yet</div>'}</div>`;fillGauge(f.risk_score)},
async cycles(){const [f,c,cy]=await Promise.all([api('farmers'),api('crops'),api('cycles')]);
 $('#app').innerHTML=head('Crop cycles','Log a planting, then record the harvest')+`<div class="card"><h3>New crop cycle</h3><form onsubmit="event.preventDefault();addC()"><label>Farmer<select id="cf">${opts(f,'farmer_id','name')}</select></label><label>Crop<select id="cc">${opts(c,'crop_id','crop_name')}</select></label><label>Area (acres)<input id="ca" type="number" step="0.1" min="0.1" required></label><label>Sowing date<input id="cd" type="date" value="${today}" required></label><button class="btn">Log cycle</button></form></div>
 <div class="card" style="margin-top:16px"><table><tr><th>Farmer</th><th>Crop</th><th>Area</th><th>Sown</th><th>Yield</th><th>Status</th><th></th></tr>${cy.map(x=>`<tr><td>${x.farmer}</td><td>${x.crop_name}</td><td>${x.area} ac</td><td>${x.sowing_date}</td><td>${x.yield_qty??'—'}</td><td><span class="chip ${x.status}">${x.status}</span></td><td>${x.status=='Growing'?`<button class="btn sm" onclick="openHarv(${x.cycle_id})">Harvest</button>`:''}</td></tr>`).join('')}</table></div>`},
async loans(){const [f,l]=await Promise.all([api('farmers'),api('loans')]);
 $('#app').innerHTML=head('Loans & repayments','Disbursement runs as one safe database transaction')+`<div class="card"><h3>Issue a loan</h3><form onsubmit="event.preventDefault();issue()"><label>Farmer<select id="lf" onchange="cyc()">${opts(f,'farmer_id','name')}</select></label><label>Crop cycle (optional)<select id="lc"><option value="">None</option></select></label><label>Amount (₹)<input id="la" type="number" min="1000" step="1" required></label><label>Days to repay<input id="ld" type="number" value="180" min="30"></label><label>Number of installments<select id="ln">${[1,2,3,4,6,12].map(n=>`<option ${n==3?'selected':''}>${n}</option>`).join('')}</select></label><button class="btn">Disburse</button></form></div>
 <div class="card" style="margin-top:16px"><table><tr><th>#</th><th>Farmer</th><th>Amount</th><th>Paid</th><th>Next installment</th><th>Status</th><th></th></tr>${l.map(x=>`<tr><td>${x.loan_id}</td><td>${x.farmer}</td><td>${M(x.amount)}</td><td>${meter(x.paid/x.amount*100)}<small style="color:var(--mut)">${M(x.paid)}</small></td><td>${x.next_due?x.next_due+' · '+M(x.next_amt):(x.status=='Repaid'?'—':x.due_date)}</td><td><span class="chip ${x.status}">${x.status}</span></td><td>${x.status!='Repaid'?`<button class="btn sm" onclick="openPay(${x.loan_id})">Repay</button>`:''}</td></tr>`).join('')}</table></div>`;cyc()},
async elig(){const e=await api('eligible');
